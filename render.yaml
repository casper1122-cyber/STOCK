# Free, temporary research host. Can sleep; storage can reset.
# No persistent disk or paid service is configured. Export backups yourself.
services:
  - type: web
    name: taiwan-stock-lab
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m stocklab.production
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: STOCKLAB_HOME
        value: /tmp/stocklab-free
      - key: STOCKLAB_EPHEMERAL_MODE
        value: "1"
      - key: STOCKLAB_API_TOKEN
        generateValue: true
